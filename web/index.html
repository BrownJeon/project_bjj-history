<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 모바일 앱 룩앤필 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BJJ" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BJJ 훈련 일지" />
    <meta property="og:title" content="BJJ 훈련 일지 — 주짓수 개인 훈련 기록·AI 코치" />
    <meta property="og:description" content="수업·드릴·스파링·기술 트리·게임플랜·참고영상을 한 곳에서 기록하고 AI 코치/분석으로 약점 진단·개선 제안을 받는 주짓수 개인 훈련 웹앱." />
    <meta property="og:url" content="https://bjj.미라클펭귄.com/" />
    <meta property="og:locale" content="ko_KR" />
    <!-- og-image·아이콘은 web/scripts/gen-app-icons.mjs 가 생성한다(task-038) — 파일을 손대지 말고 스크립트를 다시 돌린다. -->
    <meta property="og:image" content="https://bjj.미라클펭귄.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BJJ 훈련일지 앱 아이콘 — 브라운 바탕의 BJJ 글자와 검은 띠" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BJJ 훈련 일지 — 주짓수 개인 훈련 기록·AI 코치" />
    <meta name="twitter:description" content="수업·드릴·스파링·기술 트리·게임플랜·참고영상을 한 곳에서 기록하고 AI 코치/분석으로 약점 진단·개선 제안을 받는 주짓수 훈련 웹앱." />
    <meta name="twitter:image" content="https://bjj.미라클펭귄.com/og-image.png" />

    <!-- 외부 폰트 (TheRoute와 동일 패턴) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

    <!-- PWA 매니페스트·아이콘 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ico 에 sizes 를 명시해야 SVG 를 지원하는 브라우저가 ico 대신 svg 를 고른다("any" 로 두면 ico 가 이긴다). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- 정규 URL -->
    <link rel="canonical" href="https://bjj.미라클펭귄.com/" />

    <!-- 🔴 색은 web/src/styles/tokens.css 값을 리터럴로 적는다(이 파일은 번들 밖이라 CSS 변수가 아직 없다).
         bg #0C0D12 · text #EEEEF2 · text2 #7C8098 · accent #1D9E75 — tokens.css 를 고치면 여기도 같이. -->
    <style>
      /* 앱 배경과 같은 값 — 첫 페인트에서 흰 화면이 번쩍이지 않게 한다. */
      html { background: #0C0D12; }

      .prerender-shell {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px; padding: 24px; text-align: center;
        background: #0C0D12; color: #EEEEF2;
        /* app.css 의 body 와 같은 스택 — React 가 뜰 때 글꼴이 바뀌어 보이지 않도록. */
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      }
      .prerender-shell h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
      /* 24em — 412px 폭 휴대폰에서 설명 한 줄이 그대로 들어간다(그보다 좁으면 자연스럽게 접힌다). */
      .prerender-shell p  { margin: 0; font-size: 13px; line-height: 1.6; color: #7C8098; max-width: 24em; word-break: keep-all; }

      .prerender-load { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 12px; color: #7C8098; }
      .prerender-dots { display: inline-flex; align-items: center; gap: 4px; }
      .prerender-dots i {
        flex: none; width: 5px; height: 5px; border-radius: 50%; background: #1D9E75; opacity: .25;
        animation: prerender-blink 1.2s ease-in-out infinite;
      }
      .prerender-dots i:nth-child(2) { animation-delay: .16s; }
      .prerender-dots i:nth-child(3) { animation-delay: .32s; }
      @keyframes prerender-blink { 0%, 70%, 100% { opacity: .25 } 35% { opacity: 1 } }
      /* 움직임을 줄여 달라고 한 사용자에게는 깜빡이지 않는 점 3개만 남긴다. */
      @media (prefers-reduced-motion: reduce) {
        .prerender-dots i { animation: none; opacity: .5; }
      }
    </style>
    <!-- JS 가 꺼져 있으면 "로딩 중" 은 거짓말이다 — 감추고 아래 안내만 남긴다. -->
    <noscript><style>.prerender-load { display: none; }</style></noscript>
  </head>
  <body>
    <!-- React mount 전 로딩 화면 — createRoot(root).render() 가 통째로 교체한다.
         🔴 여기엔 앱 이름(h1)·설명(p)·로딩 표시만 둔다. 기능 카드·사양·색상표·가짜 하단탭은
            2026-09-09(D-8) 에 걷어냈다(사유는 task-030 이력서 "후속 D-8").
         🔴 SEO 키워드를 화면 밖에 숨기지 않는다(cloaking) — 그 몫은 위 meta 들이 한다. -->
    <div id="root">
      <div class="prerender-shell">
        <h1>BJJ 훈련 일지</h1>
        <p>주짓수 훈련을 기록하고 되돌아보는 개인 훈련 일지</p>
        <div class="prerender-load" role="status" aria-live="polite">
          <span class="prerender-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>앱 로딩 중…</span>
        </div>
        <noscript>
          <p>이 앱을 사용하려면 브라우저에서 JavaScript를 활성화해 주세요.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
