:root {
  /* 배경 계층 */
  --bg:           #0C0D12;
  --surface:      #15171E;
  --surface-up:   #1C1F28;
  --surface-hi:   #242836;

  /* 테두리 */
  --border:       rgba(255,255,255,0.06);
  --border-med:   rgba(255,255,255,0.10);

  /* 텍스트 */
  --text:         #EEEEF2;
  --text2:        #7C8098;
  --text3:        #4A4E64;

  /* 포인트 컬러 (그린) */
  --accent:       #1D9E75;
  --accent-lt:    #25C490;
  --accent-dim:   rgba(29,158,117,0.12);
  --accent-glow:  rgba(29,158,117,0.25);

  /* 시맨틱 */
  --red:          #E05A47;
  --red-dim:      rgba(224,90,71,0.12);
  --blue:         #4B8FE2;
  --blue-dim:     rgba(75,143,226,0.12);
  --amber:        #F0A830;
  --amber-dim:    rgba(240,168,48,0.12);
  --purple:       #8B6CE7;
  --purple-dim:   rgba(139,108,231,0.12);

  /* 라운딩 */
  --radius:       10px;
  --radius-lg:    14px;
  --radius-xl:    16px;

  /* 벨트 */
  --belt-white:   #E0E0E0;
  --belt-blue:    #1565C0;
  --belt-purple:  #7B1FA2;
  --belt-brown:   #795548;
  --belt-black:   #212121;

  --safe-bottom:  env(safe-area-inset-bottom, 0px);

  /* 안드로이드 앱 상단 상태바 여백(task-039 A-6). 웹은 0 — 아래 [data-native] 에서만 값이 생긴다. */
  --native-top:   0px;
}

/* 안드로이드 앱(Capacitor, targetSdk 35)은 Android 15 edge-to-edge 로 WebView 가 시스템 바 밑까지 그려지는데
   이 WebView 는 `env(safe-area-inset-*)` 를 0 으로 준다 — 상단 24px 바닥값만으로는 **하단 탭바가 내비게이션 버튼과
   겹쳤다**(2026-09-14 실기기). 그래서 앱 설정 `android.adjustMarginsForEdgeToEdge: 'auto'`(mobile/capacitor.config.ts)로
   WebView 자체를 시스템 바 바깥에 배치한다 → 웹은 상하단 여백을 따로 줄 필요가 없다. 24px 바닥값을 남기면 상단이
   이중 여백이 되므로 뺀다(env 가 실제 값을 주는 기기에서만 그만큼). `<html data-native>` 는 main.jsx 가 앱에서만 붙인다.
   🔴 이 값을 되돌리려면 capacitor.config 의 margin 설정도 함께 봐야 한다(둘 중 하나만 바꾸면 겹치거나 이중 여백). */
[data-native] {
  --native-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body, #root { height: 100%; }
body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}

button { font-family: inherit; }
input, textarea, select { font-family: inherit; color: var(--text); }

/* 앱 셸 — 모바일 우선, 데스크톱은 가운데 정렬 max 460 */
.app-shell {
  display: flex; flex-direction: column;
  /* viewport 전체 높이로 고정해야 .app-content 의 overflow-y:auto 가 동작 */
  height: 100%;
  height: 100dvh;
  max-width: 460px; margin: 0 auto;
  position: relative;
  background: var(--bg);
}
/* 안드로이드 앱 상태바 여백(task-039 A-6) — 🔴 스크롤 컨테이너(.app-content)가 아니라 **셸**에 준다.
   스크롤 컨테이너에 주면 그 안의 sticky 요소가 패딩 기준으로 붙어 스크롤 시 다시 상태바 밑으로 올라간다
   (TheMeal layout 교훈). 셸 height 는 100dvh + border-box 라 패딩만큼 내용 영역이 줄어든다.
   셸 안의 절대 배치 패널(관장실 대화·대화 관리)은 셸의 **패딩 박스** 기준이라 top:0 이 상태바 밑으로
   들어가므로 같은 값만큼 margin-top 으로 내린다(인라인 top:BAR_HEIGHT 는 그대로 둔다). */
[data-native] .app-shell { padding-top: var(--native-top); }
[data-native] .bjjm-panel,
[data-native] .bjjm-list { margin-top: var(--native-top); }

.app-content {
  flex: 1;
  min-height: 0;            /* flex item이 부모를 넘어 자라지 않도록 */
  padding: 0 20px 80px;     /* 상단 54px 은 MasterBar(task-030)가 대신한다 — 고정 아닌 일반 흐름 */
  overflow-y: auto;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
}

/* 하단 네비 (62px) */
.nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 460px;
  height: 62px;
  background: rgba(12,13,18,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
  padding: 0 4px;
  padding-bottom: var(--safe-bottom);
}
.nav-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px;
  cursor: pointer;
  color: var(--text3);
  font-size: 10px;
  text-decoration: none;
  font-weight: 400;
  transition: color 0.15s;
}
.nav-item.active { color: var(--accent); font-weight: 600; }

/* 페이지 타이틀 */
.page-header {
  font-size: 22px; font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 16px;
}

/* 카드 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 10px;
}

/* 버튼 */
.btn-primary {
  background: var(--accent); color: #fff;
  border: none; border-radius: 12px;
  padding: 11px 18px; font-weight: 600; font-size: 14px;
  cursor: pointer;
}
.btn-outline {
  background: transparent; color: var(--text);
  border: 1px solid var(--border-med);
  border-radius: 12px;
  padding: 11px 18px; font-weight: 500; font-size: 14px;
  cursor: pointer;
}
.btn-sm {
  background: transparent; color: var(--text);
  border: 1px solid var(--border-med);
  border-radius: 8px;
  padding: 7px 12px; font-size: 12px;
  cursor: pointer; font-weight: 500;
}
.btn-danger {
  background: var(--red); color: #fff;
  border: none; border-radius: 12px;
  padding: 11px 18px; font-weight: 600; font-size: 14px;
  cursor: pointer;
}

/* 태그 */
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 9px;
  background: var(--surface-hi);
  color: var(--text);
  border-radius: 6px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}

/* 입력 폼 공통 */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
.field input, .field textarea, .field select {
  width: 100%;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-med);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
}
.field textarea { min-height: 80px; resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: var(--text3); }

/* Loader */
.loader {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.loader-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border-med);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: white;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 10000;
  max-width: 80%;
  border: 1px solid var(--border-med);
}

/* 모달 슬라이드 업 애니메이션 */
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0.4; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.bjj-modal-overlay { animation: fadeIn 0.18s ease-out; }
.bjj-modal-sheet   { animation: slideUp 0.25s cubic-bezier(0.2, 0.85, 0.3, 1); }

/* 카드 active 미세 효과 */
.bjj-card-tap:active { transform: scale(0.99); transition: transform 0.08s ease-out; }

/* 페이지 fade */
.page-fade { animation: fadeIn 0.18s ease-out; }

/* 음성 분석 진행 바 */
@keyframes voiceShimmer {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}
.voice-progress-bar {
  height: 3px;
  background: var(--surface-hi);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.voice-progress-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 50%;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: voiceShimmer 1.4s ease-in-out infinite;
}

/* Modal (legacy modal-overlay/modal — 일부 페이지가 아직 사용) */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.18s ease-out;
}
.modal {
  background: var(--surface-up);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 30px;
  width: 100%; max-width: 460px;
  max-height: 88vh; overflow-y: auto;
  border-top: 1px solid var(--border-med);
  animation: slideUp 0.25s cubic-bezier(0.2, 0.85, 0.3, 1);
}
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

/* Clip 카드 (legacy: ClipsPage 내부 일부에서 사용 가능) */
.clip-thumb-placeholder {
  width: 80px; height: 50px;
  border-radius: 8px;
  background: var(--surface-hi);
  display: flex; align-items: center; justify-content: center;
  color: var(--text2);
  flex-shrink: 0;
}

.preview-tools {max-width:460px;margin:0 auto;padding:8px 14px;background:var(--surface-hi);font-size:12px;color:var(--text);height:128px;box-sizing:border-box}
.preview-tools div {display:flex;gap:10px}.preview-tools label{display:flex;align-items:center;gap:4px}.preview-tools select{min-height:44px;background:var(--surface);border:1px solid var(--border-med);border-radius:var(--radius);font-size:13px}.preview-tools p{font-size:11px}
.app-shell{height:calc(100dvh - 128px)}
.preview-section {background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;font-size:13px;line-height:1.7}
.preview-heading{font-size:14px;margin:0 0 10px;font-weight:700}.preview-heading small{font-size:11px;font-weight:400;color:var(--text)}
.preview-copy{font-size:13px;line-height:1.75;margin-bottom:12px;color:var(--text)}
.preview-section h4{font-size:12px;margin:8px 0;color:var(--text)}
.relation-link{display:flex;flex-direction:column;gap:4px;min-height:56px;width:100%;padding:10px 12px;margin:6px 0 12px;text-align:left;background:var(--surface-up);border:1px solid var(--border-med);border-radius:var(--radius);color:var(--text);font-size:13px;cursor:pointer}
.relation-link span{font-size:12px;line-height:1.6}.relation-current{padding:10px 12px;border-left:3px solid var(--accent-lt);background:var(--accent-dim);font-size:13px}
button:focus-visible,a:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-lt)!important;outline-offset:2px}
button{min-height:44px} .bjj-modal-sheet{padding-bottom:calc(30px + var(--safe-bottom))!important}
