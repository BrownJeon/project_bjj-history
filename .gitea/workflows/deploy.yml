name: Deploy BJJ Training Log

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: linux
    steps:
      - name: Sync to runtime directory (NFS)
        run: |
          cd /home/brownjeon/NFS/homes/brownjeon/project/bjj-trainning
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          git clean -fdx -e .env -e node_modules

      - name: Install dependencies
        working-directory: /home/brownjeon/NFS/homes/brownjeon/project/bjj-trainning
        run: npm ci --no-audit --no-fund --omit=dev

      # web/ 는 Vite 라 NFS noexec 위에서 빌드할 수 없다 — ext4 미러에서 빌드 후
      # 산출물만 pm2가 서빙하는 로컬 경로로 복사한다 (webhook-deploy/deploy-bjj.sh 와 동일 절차).
      - name: Sync web to ext4 mirror
        run: |
          rsync -a /home/brownjeon/NFS/homes/brownjeon/project/bjj-trainning/web/src/ \
                /home/brownjeon/.node-local/bjj-web/work/src/ --delete
          cp /home/brownjeon/NFS/homes/brownjeon/project/bjj-trainning/web/index.html \
             /home/brownjeon/.node-local/bjj-web/work/index.html
          rsync -a /home/brownjeon/NFS/homes/brownjeon/project/bjj-trainning/web/public/ \
                /home/brownjeon/.node-local/bjj-web/work/public/ --delete

      - name: Build frontend
        working-directory: /home/brownjeon/.node-local/bjj-web/work
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rsync -a dist/ /home/brownjeon/.node-local/bjj-web/dist/ --delete

      - name: Reload PM2
        run: pm2 reload bjj --update-env

      - name: Health check
        # pm2 reload 직후 curl 한 번은 Express 가 아직 바인딩되기 전이라 거의 항상 거짓
        # 실패로 끝난다 — 이 앱은 마이그레이션 점검·cron 등록·백필 착수 등 기동 시 부수
        # 작업이 있어 바인딩까지 수초~수십 초 걸릴 수 있다. 최대 30회 1초 간격 재시도.
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || (pm2 logs bjj --lines 30 --nostream && exit 1)
